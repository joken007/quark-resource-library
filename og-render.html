<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:1200px;height:630px;overflow:hidden;position:relative;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(135deg,#1e3a8a 0%,#4c1d95 55%,#7c3aed 100%);
  color:#fff;display:flex;flex-direction:column;justify-content:center;padding:0 82px;
}
/* 网格纹理 */
body:before{
  content:"";position:absolute;inset:0;
  background-image:linear-gradient(rgba(255,255,255,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.055) 1px,transparent 1px);
  background-size:60px 60px;
}
/* 右上光晕 */
body:after{
  content:"";position:absolute;width:620px;height:620px;border-radius:50%;
  right:-190px;top:-230px;
  background:radial-gradient(circle,rgba(139,92,246,.55),transparent 68%);
}
.z{position:relative;z-index:2}
.badge{
  display:inline-flex;align-items:center;gap:9px;
  background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);
  padding:9px 18px;border-radius:999px;font-size:19px;font-weight:500;
  margin-bottom:30px;backdrop-filter:blur(10px);
}
.dot{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 12px #4ade80}
h1{font-size:76px;font-weight:800;letter-spacing:-2.5px;line-height:1.05;margin-bottom:22px}
h1 em{font-style:normal;background:linear-gradient(90deg,#a5b4fc,#e9d5ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{font-size:27px;color:rgba(255,255,255,.84);font-weight:400;margin-bottom:42px}
.stats{display:flex;gap:58px}
.s b{display:block;font-size:46px;font-weight:800;letter-spacing:-1px;line-height:1.1}
.s span{font-size:17px;color:rgba(255,255,255,.68);margin-top:6px;display:block}
.tagrow{position:absolute;right:82px;bottom:74px;text-align:right;z-index:2}
.tagrow p{font-size:17px;color:rgba(255,255,255,.62);margin-bottom:12px}
.tagrow .u{font-size:23px;font-weight:700;color:#fff}
.tagrow .u span{color:#c4b5fd}
</style>
</head>
<body>
<div class="z">
  <div class="badge"><span class="dot"></span>每日更新 · 点开直接转存</div>
  <h1>夸克网盘<em>资源库</em></h1>
  <div class="sub">学习资料 · 考研考公 · 电子书 · 课程 · AI 工具</div>
  <div class="stats">
    <div class="s"><b>228</b><span>个资源</span></div>
    <div class="s"><b>13</b><span>个分类</span></div>
    <div class="s"><b>10+</b><span>每天新增</span></div>
  </div>
</div>
<div class="tagrow">
  <p>独立整理 · 非二手转载</p>
  <div class="u">joken007.github.io<span>/quark-resource-library</span></div>
</div>
</body>
</html>
